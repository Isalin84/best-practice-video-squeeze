name: Build installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS installers
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Build DMG and ZIP
        run: npm run dist:mac
      - name: Verify packaged tools
        run: node scripts/check-bundle.cjs
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Build NSIS and portable installers
        run: npm run dist:win
      - name: Verify packaged tools
        run: node scripts/check-bundle.cjs
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: release-files
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-files
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          name: Video Squeeze 1.2.0
          body: |
            Исправлен выбор и перетаскивание видео. Новая иконка приложения.
            FFmpeg включён в установщики; приложение работает локально.

            macOS: выберите arm64 для Apple Silicon или x64 для Intel, откройте DMG и перенесите приложение в Applications.
            Windows: setup.exe — установка с ярлыком; portable.exe — запуск без установки.

            Сборки не подписаны сертификатами Apple Developer ID / Microsoft. macOS Gatekeeper и Windows SmartScreen могут показывать предупреждения.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-files/*
